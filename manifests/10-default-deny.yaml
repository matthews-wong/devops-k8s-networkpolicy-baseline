apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: shop
  labels:
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: network-policy
spec:
  # An empty podSelector selects every pod, so anything not allowed elsewhere is dropped.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
